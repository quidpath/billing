services:
  db:
    image: postgres:15
    container_name: postgres_billing_prod
    restart: unless-stopped
    volumes:
      - /mnt/ebs/postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - billing_network
      - quidpath_network

  backend:
    build: .
    container_name: billing-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - /mnt/ebs/media:/app/media
      - /mnt/ebs/staticfiles:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/billing/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - billing_network
      - quidpath_network

networks:
  billing_network:
    driver: bridge
  quidpath_network:
    external: true
