name: Build Image & Trigger Deployment

on:
  push:
    branches: ["Development", "master"]

jobs:
  build-and-trigger:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Determine environment & select compose file
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "master" ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "compose_file=docker-compose.yml" >> $GITHUB_OUTPUT
          else
            echo "env=stage" >> $GITHUB_OUTPUT
            echo "compose_file=docker-compose.stage.yml" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate Docker Image Tag
        id: tag
        run: |
          IMAGE_NAME="quidpath_billing"
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          ENV_NAME="${{ steps.env.outputs.env }}"
          
          # Include environment in tag for clarity and safety
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:${ENV_NAME}-${TIMESTAMP}"
          
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "Generated Docker image tag: $IMAGE_TAG"
      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.image_tag }}
          platforms: linux/amd64,linux/arm64/v8
      
      - name: Encode selected docker-compose file
        id: compose
        run: |
          COMPOSE_FILE="${{ steps.env.outputs.compose_file }}"
          
          if [ ! -f "$COMPOSE_FILE" ]; then
            echo "Error: $COMPOSE_FILE not found in repository!"
            exit 1
          fi
          
          COMPOSE_B64=$(base64 -w 0 "$COMPOSE_FILE")
          echo "b64=$COMPOSE_B64" >> $GITHUB_OUTPUT
      
      - name: Validate stage DB secrets (avoid auth failure on server)
        if: steps.env.outputs.env == 'stage'
        run: |
          missing=""
          [ -z "${{ secrets.POSTGRES_USER_STAGE }}" ] && missing="${missing} POSTGRES_USER_STAGE"
          [ -z "${{ secrets.POSTGRES_PASSWORD_STAGE }}" ] && missing="${missing} POSTGRES_PASSWORD_STAGE"
          [ -z "${{ secrets.POSTGRES_DB_STAGE }}" ] && missing="${missing} POSTGRES_DB_STAGE"
          if [ -n "$missing" ]; then
            echo "::error::Billing stage requires these GitHub secrets to be set:$missing"
            echo "::error::See docs/staging-database-credentials.md"
            exit 1
          fi
          # Ensure stage does not use prod-style DB user (avoid picking up prod credentials)
          if [ "${{ secrets.POSTGRES_USER_STAGE }}" = "billing_user" ]; then
            echo "::error::POSTGRES_USER_STAGE must be a stage-specific user (e.g. billing_user_stage), not 'billing_user' (prod)."
            echo "::error::Set POSTGRES_USER_STAGE in GitHub Actions secrets and ensure stage Postgres is initialized with that user."
            exit 1
          fi
          # POSTGRES_DB_STAGE must match the database name inside container postgres_billing_stage (e.g. postgres_billing_stage)
          echo "Stage DB: POSTGRES_DB_STAGE=${{ secrets.POSTGRES_DB_STAGE }} (must match DB name in postgres_billing_stage container)"
      
      - name: Prepare env_secrets payload
        id: prepare_secrets
        env:
          ENV_NAME: ${{ steps.env.outputs.env }}
        run: |
          declare -A secrets=()
          
          # Stage uses its own DB (compose service name: db). Prod uses DATABASE_URL from secrets.
          if [[ "$ENV_NAME" == "stage" ]]; then
            if [ -n "${{ secrets.DATABASE_URL_STAGE }}" ]; then
              secrets["DATABASE_URL"]="${{ secrets.DATABASE_URL_STAGE }}"
            else
              # Host is 'db' (compose service name). Container name postgres_billing_stage is not the hostname.
              # POSTGRES_DB_STAGE must match the actual database name in that container (e.g. postgres_billing_stage).
              secrets["DATABASE_URL"]="postgresql://${{ secrets.POSTGRES_USER_STAGE }}:${{ secrets.POSTGRES_PASSWORD_STAGE }}@db:5432/${{ secrets.POSTGRES_DB_STAGE }}"
            fi
            secrets["POSTGRES_USER"]="${{ secrets.POSTGRES_USER_STAGE }}"
            secrets["POSTGRES_DB"]="${{ secrets.POSTGRES_DB_STAGE }}"
            secrets["POSTGRES_PASSWORD"]="${{ secrets.POSTGRES_PASSWORD_STAGE }}"
            secrets["SECRET_KEY"]="${{ secrets.SECRET_KEY_STAGE || secrets.SECRET_KEY }}"
            secrets["JWT_SECRET_KEY"]="${{ secrets.JWT_SECRET_KEY_STAGE || secrets.JWT_SECRET_KEY }}"
            secrets["MPESA_CALLBACK_URL"]="https://stage-billing.quidpath.com/api/billing/webhooks/mpesa/"
            secrets["PESAWAY_WEBHOOK_URL"]="https://stage-billing.quidpath.com/api/billing/webhooks/pesaway/"
          else
            secrets["POSTGRES_USER"]="${{ secrets.POSTGRES_USER }}"
            secrets["POSTGRES_DB"]="${{ secrets.POSTGRES_DB }}"
            secrets["DATABASE_URL"]="${{ secrets.DATABASE_URL }}"
            secrets["POSTGRES_PASSWORD"]="${{ secrets.POSTGRES_PASSWORD }}"
            secrets["SECRET_KEY"]="${{ secrets.SECRET_KEY }}"
            secrets["JWT_SECRET_KEY"]="${{ secrets.JWT_SECRET_KEY }}"
            secrets["MPESA_CALLBACK_URL"]="${{ secrets.MPESA_CALLBACK_URL }}"
            secrets["PESAWAY_WEBHOOK_URL"]="${{ secrets.PESAWAY_WEBHOOK_URL }}"
          fi
          # Shared live M-Pesa and Pesaway (no _STAGE; same for stage and prod)
          secrets["PESAWAY_API_KEY"]="${{ secrets.PESAWAY_API_KEY }}"
          secrets["PESAWAY_SECRET_KEY"]="${{ secrets.PESAWAY_SECRET_KEY }}"
          secrets["PESAWAY_MERCHANT_ID"]="${{ secrets.PESAWAY_MERCHANT_ID }}"
          secrets["PESAWAY_WEBHOOK_SECRET"]="${{ secrets.PESAWAY_WEBHOOK_SECRET }}"
          secrets["PESAWAY_TEST_MODE"]="${{ secrets.PESAWAY_TEST_MODE }}"
          secrets["MPESA_CONSUMER_KEY"]="${{ secrets.MPESA_CONSUMER_KEY }}"
          secrets["MPESA_CONSUMER_SECRET"]="${{ secrets.MPESA_CONSUMER_SECRET }}"
          secrets["MPESA_SHORTCODE"]="${{ secrets.MPESA_SHORTCODE }}"
          secrets["MPESA_BUSINESS_SHORT_CODE"]="${{ secrets.MPESA_BUSINESS_SHORT_CODE }}"
          secrets["MPESA_TILL_NUMBER"]="${{ secrets.MPESA_TILL_NUMBER }}"
          secrets["MPESA_PASSKEY"]="${{ secrets.MPESA_PASSKEY }}"
          secrets["MPESA_TEST_MODE"]="${{ secrets.MPESA_TEST_MODE }}"
          secrets["MPESA_ENVIRONMENT"]="${{ secrets.MPESA_ENVIRONMENT }}"
          
          json="{}"
          for key in "${!secrets[@]}"; do
            value="${secrets[$key]}"
            if [ -n "$value" ]; then
              json=$(echo "$json" | jq --arg k "$key" --arg v "$value" '.[$k] = $v')
            fi
          done
          
          compact=$(echo "$json" | jq -c .)
          echo "secrets_json=$compact" >> $GITHUB_OUTPUT
      
      - name: Trigger Deployment in Infra Repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_PAT }}
          repository: stevendegwa/infra
          event-type: deploy-app
          client-payload: |
            {
              "app_repo": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "env": "${{ steps.env.outputs.env }}",
              "sha": "${{ github.sha }}",
              "image_tag": "${{ steps.tag.outputs.image_tag }}",
              "docker_compose_b64": "${{ steps.compose.outputs.b64 }}",
              "env_secrets": ${{ steps.prepare_secrets.outputs.secrets_json }}
            }
