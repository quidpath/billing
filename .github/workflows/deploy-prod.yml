name: Build Prod Image & Deploy (Billing)

on:
  push:
    branches: ["main", "master"]

jobs:
  build-and-trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker Image Tag
        id: tag
        run: |
          IMAGE_NAME="quidpath_billing"
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:prod-${TIMESTAMP}"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "Generated Docker image tag: $IMAGE_TAG"

      - name: Build and Push Docker Image (Prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.image_tag }}
          platforms: linux/amd64,linux/arm64/v8

      - name: Encode docker-compose.yml
        id: compose
        run: |
          if [ ! -f "docker-compose.yml" ]; then
            echo "Error: docker-compose.yml not found!"
            exit 1
          fi
          COMPOSE_B64=$(base64 -w 0 docker-compose.yml)
          echo "b64=$COMPOSE_B64" >> $GITHUB_OUTPUT

      - name: Prepare env_secrets payload (Production secrets only)
        id: prepare_secrets
        run: |
          declare -A secrets=()

          # Production database
          secrets["POSTGRES_USER"]="${{ secrets.POSTGRES_USER }}"
          secrets["POSTGRES_DB"]="${{ secrets.POSTGRES_DB }}"
          secrets["DATABASE_URL"]="${{ secrets.DATABASE_URL }}"
          secrets["POSTGRES_PASSWORD"]="${{ secrets.POSTGRES_PASSWORD }}"

          # Production app secrets
          secrets["SECRET_KEY"]="${{ secrets.SECRET_KEY }}"
          secrets["JWT_SECRET_KEY"]="${{ secrets.JWT_SECRET_KEY }}"
          secrets["BILLING_SERVICE_SECRET"]="${{ secrets.BILLING_SERVICE_SECRET }}"
          secrets["BILLING_WEBHOOK_SECRET"]="${{ secrets.BILLING_WEBHOOK_SECRET }}"

          # Production webhook URLs
          secrets["MPESA_CALLBACK_URL"]="${{ secrets.MPESA_CALLBACK_URL }}"
          secrets["PESAWAY_WEBHOOK_URL"]="${{ secrets.PESAWAY_WEBHOOK_URL }}"

          # Payment provider
          secrets["PESAWAY_API_KEY"]="${{ secrets.PESAWAY_API_KEY }}"
          secrets["PESAWAY_SECRET_KEY"]="${{ secrets.PESAWAY_SECRET_KEY }}"
          secrets["PESAWAY_MERCHANT_ID"]="${{ secrets.PESAWAY_MERCHANT_ID }}"
          secrets["PESAWAY_WEBHOOK_SECRET"]="${{ secrets.PESAWAY_WEBHOOK_SECRET }}"
          secrets["PESAWAY_TEST_MODE"]="${{ secrets.PESAWAY_TEST_MODE }}"
          secrets["MPESA_CONSUMER_KEY"]="${{ secrets.MPESA_CONSUMER_KEY }}"
          secrets["MPESA_CONSUMER_SECRET"]="${{ secrets.MPESA_CONSUMER_SECRET }}"
          secrets["MPESA_SHORTCODE"]="${{ secrets.MPESA_SHORTCODE }}"
          secrets["MPESA_BUSINESS_SHORT_CODE"]="${{ secrets.MPESA_BUSINESS_SHORT_CODE }}"
          secrets["MPESA_TILL_NUMBER"]="${{ secrets.MPESA_TILL_NUMBER }}"
          secrets["MPESA_PASSKEY"]="${{ secrets.MPESA_PASSKEY }}"
          secrets["MPESA_TEST_MODE"]="${{ secrets.MPESA_TEST_MODE }}"
          secrets["MPESA_ENVIRONMENT"]="${{ secrets.MPESA_ENVIRONMENT }}"

          # Paystack payment gateway
          secrets["PAYSTACK_PUBLIC_KEY"]="${{ secrets.PAYSTACK_PUBLIC_KEY_PROD }}"
          secrets["PAYSTACK_SECRET_KEY"]="${{ secrets.PAYSTACK_SECRET_KEY_PROD }}"
          secrets["PAYSTACK_TEST_MODE"]="${{ secrets.PAYSTACK_TEST_MODE_PROD }}"
          secrets["PAYSTACK_CALLBACK_URL"]="https://api.quidpath.com/api/billing/payments/callback/"
          secrets["PAYSTACK_WEBHOOK_URL"]="https://api.quidpath.com/api/billing/webhooks/paystack/"

          # Production allowed hosts
          secrets["ALLOWED_HOSTS"]="${{ secrets.ALLOWED_HOSTS }}"
          
          # ERP Backend URL for service-to-service communication
          secrets["ERP_BACKEND_URL"]="http://quidpath-backend-prod:8004"
          secrets["FRONTEND_URL"]="https://www.quidpath.com"
          secrets["BACKEND_URL"]="https://api.quidpath.com"

          json="{}"
          for key in "${!secrets[@]}"; do
            value="${secrets[$key]}"
            if [ -n "$value" ]; then
              json=$(echo "$json" | jq --arg k "$key" --arg v "$value" '.[$k] = $v')
            fi
          done

          compact=$(echo "$json" | jq -c .)
          echo "secrets_json=$compact" >> $GITHUB_OUTPUT

      - name: Trigger Prod Deployment in Infra Repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_PAT }}
          repository: stevendegwa/infra
          event-type: deploy-app
          client-payload: |
            {
              "app_repo": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "env": "prod",
              "sha": "${{ github.sha }}",
              "image_tag": "${{ steps.tag.outputs.image_tag }}",
              "docker_compose_b64": "${{ steps.compose.outputs.b64 }}",
              "env_secrets": ${{ steps.prepare_secrets.outputs.secrets_json }}
            }
