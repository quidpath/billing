name: Build Stage Image & Deploy (Billing)

on:
  push:
    branches: ["Development"]

jobs:
  build-and-trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker Image Tag
        id: tag
        run: |
          IMAGE_NAME="quidpath_billing"
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:stage-${TIMESTAMP}"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "Generated Docker image tag: $IMAGE_TAG"

      - name: Build and Push Docker Image (Stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.stage
          push: true
          tags: ${{ steps.tag.outputs.image_tag }}
          platforms: linux/amd64,linux/arm64/v8

      - name: Encode docker-compose.stage.yml
        id: compose
        run: |
          if [ ! -f "docker-compose.stage.yml" ]; then
            echo "Error: docker-compose.stage.yml not found!"
            exit 1
          fi
          COMPOSE_B64=$(base64 -w 0 docker-compose.stage.yml)
          echo "b64=$COMPOSE_B64" >> $GITHUB_OUTPUT

      - name: Prepare env_secrets payload (Stage secrets only)
        id: prepare_secrets
        run: |
          declare -A secrets=()

          # Stage database (set DATABASE_URL_STAGE if you use a full URL, or rely on POSTGRES_*_STAGE)
          secrets["POSTGRES_USER"]="${{ secrets.POSTGRES_USER_STAGE }}"
          secrets["POSTGRES_DB"]="${{ secrets.POSTGRES_DB_STAGE }}"
          secrets["POSTGRES_PASSWORD"]="${{ secrets.POSTGRES_PASSWORD_STAGE }}"
          secrets["DATABASE_URL"]="${{ secrets.DATABASE_URL_STAGE }}"

          # Stage app secrets (JWT_SECRET_KEY must match main backend so user tokens verify)
          secrets["SECRET_KEY"]="${{ secrets.SECRET_KEY }}"
          secrets["JWT_SECRET_KEY"]="${{ secrets.JWT_SECRET_KEY }}"
          secrets["BILLING_SERVICE_SECRET"]="${{ secrets.BILLING_SERVICE_SECRET }}"

          # Stage webhook URLs
          secrets["MPESA_CALLBACK_URL"]="https://stage-billing.quidpath.com/api/billing/webhooks/mpesa/"
          secrets["PESAWAY_WEBHOOK_URL"]="https://stage-billing.quidpath.com/api/billing/webhooks/pesaway/"

          # Payment provider (use stage variants if you have them, else same as prod)
          secrets["PESAWAY_API_KEY"]="${{ secrets.PESAWAY_API_KEY }}"
          secrets["PESAWAY_SECRET_KEY"]="${{ secrets.PESAWAY_SECRET_KEY }}"
          secrets["PESAWAY_MERCHANT_ID"]="${{ secrets.PESAWAY_MERCHANT_ID }}"
          secrets["PESAWAY_WEBHOOK_SECRET"]="${{ secrets.PESAWAY_WEBHOOK_SECRET }}"
          secrets["PESAWAY_TEST_MODE"]="${{ secrets.PESAWAY_TEST_MODE }}"
          secrets["MPESA_CONSUMER_KEY"]="${{ secrets.MPESA_CONSUMER_KEY }}"
          secrets["MPESA_CONSUMER_SECRET"]="${{ secrets.MPESA_CONSUMER_SECRET }}"
          secrets["MPESA_SHORTCODE"]="${{ secrets.MPESA_SHORTCODE }}"
          secrets["MPESA_BUSINESS_SHORT_CODE"]="${{ secrets.MPESA_BUSINESS_SHORT_CODE }}"
          secrets["MPESA_TILL_NUMBER"]="${{ secrets.MPESA_TILL_NUMBER }}"
          secrets["MPESA_PASSKEY"]="${{ secrets.MPESA_PASSKEY }}"
          secrets["MPESA_TEST_MODE"]="${{ secrets.MPESA_TEST_MODE }}"
          secrets["MPESA_ENVIRONMENT"]="${{ secrets.MPESA_ENVIRONMENT }}"
          secrets["SMTP_USER"]="${{ secrets.SMTP_USER }}"
          secrets["SMTP_PASSWORD"]="${{ secrets.SMTP_PASSWORD }}"

          # Stage allowed hosts
          secrets["ALLOWED_HOSTS"]="stage-billing.quidpath.com,localhost,127.0.0.1,0.0.0.0"
          
          # Paystack - Stage (webhook verification uses SECRET_KEY)
          secrets["PAYSTACK_PUBLIC_KEY"]="${{ secrets.PAYSTACK_PUBLIC_KEY_STAGING }}"
          secrets["PAYSTACK_SECRET_KEY"]="${{ secrets.PAYSTACK_SECRET_KEY_STAGING }}"
          secrets["PAYSTACK_TEST_MODE"]="${{ secrets.PAYSTACK_TEST_MODE_STAGING }}"
          secrets["PAYSTACK_CALLBACK_URL"]="https://stage-api.quidpath.com/api/billing/payments/callback/"
          secrets["PAYSTACK_WEBHOOK_URL"]="https://stage-api.quidpath.com/api/billing/webhooks/paystack/"
          secrets["FRONTEND_URL"]="https://stage.quidpath.com"
          secrets["BACKEND_URL"]="https://stage-api.quidpath.com"

          json="{}"
          for key in "${!secrets[@]}"; do
            value="${secrets[$key]}"
            if [ -n "$value" ]; then
              json=$(echo "$json" | jq --arg k "$key" --arg v "$value" '.[$k] = $v')
            fi
          done

          compact=$(echo "$json" | jq -c .)
          echo "secrets_json=$compact" >> $GITHUB_OUTPUT

      - name: Trigger Stage Deployment in Infra Repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_PAT }}
          repository: stevendegwa/infra
          event-type: deploy-app
          client-payload: |
            {
              "app_repo": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "env": "stage",
              "sha": "${{ github.sha }}",
              "image_tag": "${{ steps.tag.outputs.image_tag }}",
              "docker_compose_b64": "${{ steps.compose.outputs.b64 }}",
              "env_secrets": ${{ steps.prepare_secrets.outputs.secrets_json }}
            }
